<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">           
        <title>数据采集</title>
    </head>

    <body>
        <div id="all">
            <div id="upper_part">  <!--标题块与选择数据源：cngal网站-->

                <div id="title">
                    <img src="img/icg-spider.png">
                    <p>数据采集平台</p>
                </div>

                <select id="choose_source">
                    <option value="" disabled selected hidden>请选择数据源</option>
                    <option>cngal网站</option>
                </select>

            </div>

            <div id="central_head">  <!--选择想要的数据与筛选条件-->

                <div id="choose_type">  <!--位置1：放置采集数据类型：cngal网站(周报|文章|评论)-->

                    <select id="choose_cngal_type">  <!--cngal网站-->
                        <option value="" disabled selected hidden>请选择采集类型</option>
                        <option>文章</option>
                        <option>评论</option>
                    </select>

                </div>

                <div id="choose_condition_a">  <!--位置2：放置一级筛选条件-->

                    <select id="choose_week_year">  <!--cngal网站的文章筛选-->
                        <option value="" disabled selected hidden>请选择文章类型</option>
                        <option>周报</option>
                        <option>游戏</option>
                        <option>文章</option>
                    </select>

                </div>

                <div id="choose_condition_b">  <!--位置3：放置二级筛选条件-->

                    <select id="choose_cngal_week_year">  <!--cngal网站的周报年份筛选-->
                        <option value="" disabled selected hidden>请选择年份</option>
                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>
                    </select>


                </div>

                <div id="choose_condition_c">  <!--位置4：放置三级筛选条件-->

                    <div id="choose_cngal_weekly_page">  <!--cngal网站的周报页码筛选-->

                        <P>请选择查询页面:</P>
                        <input id="start_cngal_weekly_page" type="text" />
                        <p>-</p>
                        <input id="end_cngal_weekly_page" type="text" />
                        <p>页</p>

                    </div>

                </div>

                <div id="start">
                    <button id="start_collect" class="start"><img src="img/开始.png"> 开始采集</button>
                    <button id="collect_history" class="start"><img src="img/历史记录.png"> 采集历史</button>
                    <button id="clear_log" class="start"><img src="img/清空设置.png"> 清空日志</button>
                </div>
            </div>

            <div id="central_body">  <!--展示table与文件内容-->

                <div id="show_table">  <!--展示table-->

                    <table id="cngal_weekly_table">  <!--周报表-->

                        <thead>

                            <tr>
                                <th>文章标题</th>
                                <th>文章地址</th>
                                <th>正文文件路径</th>
                            </tr>

                        </thead>

                        <tbody>

                        </tbody>

                    </table>

                </div>

                <div id="show_file">  <!--展示文件内容-->
                   
                    <p id="file"></p>
                    <button>跳转并打开此文件</button>

                </div>

            </div>

            <div id="lower_part">  <!--日志-->

                <div class="log"><span id="time">[时间]</span>欢迎使用信息采集系统。</div>
                <div class="log"><span id="time">[时间]</span>评论采集默认采集最新评论，查找往期评论数据可使用[采集历史]功能。</div>

            </div>
        </div>

        <script src="plugin/jquery-4.0.0.min.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/api.js"></script>
        <script src="js/main.js"></script>

    </body>
    
</html>
